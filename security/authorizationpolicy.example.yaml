apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: study-ip-allowlist
  namespace: istio-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public-gateway
  action: DENY
  rules:
    - to:
        - operation:
            hosts:
              - study.ggang.cloud
      from:
        - source:
            # replace 198.51.100.0/24 with allowed client CIDR(s); all others get 403
            notRemoteIpBlocks:
              - 198.51.100.0/24
