<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="study notes">
  <!-- 문서 자체 캐싱 방지 (브라우저/프록시가 옛 index.html·.md 붙들지 않게) -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>study</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <!-- KaTeX 수식 스타일 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <style>
    /* ===== 읽기 글씨 크기 (A+/A- 버튼으로 조절, 본문·표·목록에 적용) ===== */
    .markdown-section { font-size: var(--md-font, 15px); }

    /* ===== 모바일 가로 넘침/양옆 잘림 방지 ===== */
    html, body { max-width: 100%; overflow-x: hidden; }
    .markdown-section { max-width: 100%; box-sizing: border-box; }
    .markdown-section table {
      display: block;
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .markdown-section pre { overflow-x: auto; }
    .markdown-section p,
    .markdown-section li,
    .markdown-section td,
    .markdown-section th { overflow-wrap: anywhere; word-break: break-word; }

    @media (max-width: 768px) {
      .markdown-section { padding: 16px 14px !important; }
      .content { left: 0 !important; }
    }

    /* ===== 사이드바 상단 컨트롤(글씨 크기 + 캐시 비우기) ===== */
    #study-controls {
      display: none;               /* 사이드바에 삽입된 뒤 JS가 flex로 표시 */
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 16px;
      margin: 0;
      border-bottom: 1px solid rgba(0, 0, 0, .08);
    }
    #study-controls button {
      color: #fff;
      background: #42b983;
      border: none;
      border-radius: 999px;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .15);
      cursor: pointer;
      opacity: .92;
      transition: opacity .15s ease;
    }
    #study-controls button:hover { opacity: 1; }
    #study-controls button:active { transform: translateY(1px); }
    #study-controls .font-btn {
      width: 36px; height: 32px;
      font-size: 15px; font-weight: 700; line-height: 1;
    }
    #study-controls .font-btn.small { font-size: 12px; }
    #study-controls #clear-cache { padding: 7px 12px; font-size: 12px; line-height: 1; margin-left: auto; }
    #study-controls .label { font-size: 12px; color: #7f8c8d; margin-right: 2px; }

    /* ===== 사이드바 열고 닫는 토글: 좌측 상단 고정 ===== */
    .sidebar-toggle {
      position: fixed;
      top: 8px; left: 8px; bottom: auto;
      width: 40px; height: 36px; padding: 9px;
      background: #42b983;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .2);
      z-index: 40;
    }
    .sidebar-toggle .sidebar-toggle-button span,
    .sidebar-toggle span { background-color: #fff !important; }
    /* 사이드바 제목이 토글 버튼과 겹치지 않게 살짝 띄움 */
    .sidebar .app-name { padding-left: 52px; }

    /* ===== 글쓰기(펜 주석) 패널: 캔버스 + 항상 떠 있는 플로팅 툴바 ===== */
    #draw-canvas {
      position: absolute;
      z-index: 5;
      pointer-events: none;       /* 평소엔 통과(읽기·스크롤·선택 가능) */
    }
    #draw-canvas.is-active {
      pointer-events: auto;       /* 그리기 ON일 때만 입력 받음 */
      cursor: crosshair;
      touch-action: none;         /* 그릴 때만 스크롤 방지 */
    }
    /* 그리기 ON 동안 본문 글자가 같이 드래그·선택되지 않게 */
    body.drawing-active, body.drawing-active * {
      -webkit-user-select: none !important;
      -moz-user-select: none !important;
      user-select: none !important;
      -webkit-touch-callout: none !important;
    }
    /* 우하단에 항상 떠 있는 글쓰기 패널 — 펜 버튼으로 켜고 끔 */
    #draw-toolbar {
      position: fixed;
      right: 14px; bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
      max-width: 94vw;
      padding: 6px;
      background: #ffffff;
      border: 1px solid #e1e4e8;
      border-radius: 999px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, .18);
      z-index: 60;
    }
    #draw-toolbar.is-active { border-radius: 14px; }
    /* 비활성: 펜 버튼만 보이고 도구는 숨김 */
    #draw-toolbar .dt-tools { display: none; align-items: center; gap: 8px; flex-wrap: wrap; }
    #draw-toolbar.is-active .dt-tools { display: flex; }
    #draw-toolbar .dt-group {
      display: flex; align-items: center; gap: 6px;
      padding-right: 8px; border-right: 1px solid #eee;
    }
    #draw-toolbar .dt-group:last-child { border-right: 0; padding-right: 0; }
    #draw-toolbar button {
      min-width: 34px; height: 34px;
      padding: 0 7px;
      font-size: 15px; line-height: 1;
      background: #f4f6f8; color: #333;
      border: 1px solid #e1e4e8; border-radius: 8px;
      cursor: pointer;
    }
    #draw-toolbar button:hover { background: #eaeef1; }
    #draw-toolbar button.is-on { background: #42b983; color: #fff; border-color: #42b983; }
    /* 펜(그리기 켜기) 버튼 */
    #dt-power { border-radius: 50% !important; min-width: 42px; width: 42px; height: 42px; font-size: 18px; }
    #draw-toolbar.is-active #dt-power { background: #42b983; color: #fff; border-color: #42b983; }
    #draw-toolbar .dt-color {
      width: 24px; height: 24px; min-width: 24px;
      padding: 0; border-radius: 50%; border: 2px solid #fff;
      box-shadow: 0 0 0 1px #ccc;
    }
    #draw-toolbar .dt-color.is-on { box-shadow: 0 0 0 2px #42b983; }
  </style>
</head>
<body>
  <div id="app">로딩 중…</div>

  <!-- 사이드바로 이동되는 컨트롤 (초기엔 숨김) -->
  <div id="study-controls">
    <span class="label">글씨</span>
    <button id="font-dec" class="font-btn small" title="글씨 작게">A−</button>
    <button id="font-inc" class="font-btn" title="글씨 크게">A+</button>
    <button id="clear-cache" title="캐시·스토리지를 비우고 새로고침합니다">🗑 캐시</button>
  </div>

  <!-- 글쓰기(펜 주석) 패널 — 항상 떠 있고, 펜 버튼으로 켜고 끔 -->
  <div id="draw-toolbar">
    <div class="dt-tools">
      <div class="dt-group">
        <button data-draw-tool="pen" class="dt-tool is-on" title="펜">✏️</button>
        <button data-draw-tool="hl" class="dt-tool" title="형광펜">🖍️</button>
        <button data-draw-tool="eraser" class="dt-tool" title="지우개">🧽</button>
      </div>
      <div class="dt-group">
        <button class="dt-color is-on" data-draw-color="#e23b3b" style="background:#e23b3b" title="빨강"></button>
        <button class="dt-color" data-draw-color="#2b6cff" style="background:#2b6cff" title="파랑"></button>
        <button class="dt-color" data-draw-color="#2bb673" style="background:#2bb673" title="초록"></button>
        <button class="dt-color" data-draw-color="#f5a623" style="background:#f5a623" title="노랑"></button>
        <button class="dt-color" data-draw-color="#222222" style="background:#222" title="검정"></button>
      </div>
      <div class="dt-group">
        <button data-draw-size="2" class="dt-size" title="가늘게">˙</button>
        <button data-draw-size="4" class="dt-size is-on" title="보통">•</button>
        <button data-draw-size="8" class="dt-size" title="굵게">●</button>
      </div>
      <div class="dt-group">
        <button id="dt-undo" title="실행취소">↩</button>
        <button id="dt-clear" title="이 문서 주석 지우기">🗑</button>
        <button id="dt-png" title="PNG로 저장">💾</button>
      </div>
    </div>
    <button id="dt-power" title="그리기 켜기/끄기">✏️</button>
  </div>

  <script>
    // 저장된 글씨 크기 먼저 적용(깜빡임 최소화)
    (function () {
      var px = parseInt(localStorage.getItem('md-font'), 10);
      if (px >= 12 && px <= 24) {
        document.documentElement.style.setProperty('--md-font', px + 'px');
      }
    })();

    window.$docsify = {
      name: 'study',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      requestHeaders: { 'cache-control': 'no-cache' },
      search: {
        maxAge: 1000 * 60 * 60,
        placeholder: '검색',
        noData: '검색 결과가 없습니다'
      },
      plugins: [
        function (hook) {
          // 컨트롤을 사이드바 최상단(앱 이름 아래)으로 이동
          function mount() {
            var sidebar = document.querySelector('.sidebar');
            var controls = document.getElementById('study-controls');
            if (!sidebar || !controls) return;
            if (controls.parentElement !== sidebar) {
              var anchor = sidebar.querySelector('.app-name');
              if (anchor && anchor.nextSibling) sidebar.insertBefore(controls, anchor.nextSibling);
              else sidebar.insertBefore(controls, sidebar.firstChild);
            }
            controls.style.display = 'flex';
          }
          hook.mounted(mount);
          hook.doneEach(mount); // 라우팅 후에도 유지
        }
      ]
    }
  </script>
  <!-- 펜 주석(글쓰기 패널) 플러그인 (docsify 로드 전에 등록) -->
  <script src="assets/draw.js"></script>
  <!-- 앵커 스크롤 보강 (?id= 헤딩 이동) -->
  <script src="assets/anchor.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <!-- KaTeX: 인라인 $...$ , 디스플레이 $$...$$ 렌더 (markdown 파싱 전 수식 보호) -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-katex@1.4.4/dist/docsify-katex.js"></script>

  <!-- 컨트롤 동작: 글씨 크기 + 캐시/스토리지 정리 -->
  <script>
    (function () {
      var MIN = 12, MAX = 24, DEFAULT = 15;
      function getFont() {
        var v = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--md-font'), 10);
        return (v >= MIN && v <= MAX) ? v : DEFAULT;
      }
      function setFont(px) {
        px = Math.min(MAX, Math.max(MIN, px));
        document.documentElement.style.setProperty('--md-font', px + 'px');
        try { localStorage.setItem('md-font', String(px)); } catch (e) {}
      }
      document.addEventListener('click', async function (ev) {
        var t = ev.target;
        if (!t || t.tagName !== 'BUTTON') return;
        if (t.id === 'font-inc') { setFont(getFont() + 1); return; }
        if (t.id === 'font-dec') { setFont(getFont() - 1); return; }
        if (t.id === 'clear-cache') {
          t.disabled = true; t.textContent = '비우는 중…';
          // 글씨 크기 + 필기(draw:*)는 보존하고 나머지만 비운다
          var keep = {};
          try {
            for (var i = 0; i < localStorage.length; i++) {
              var k = localStorage.key(i);
              if (k === 'md-font' || k.indexOf('draw:') === 0) keep[k] = localStorage.getItem(k);
            }
          } catch (e) {}
          try {
            try { localStorage.clear(); } catch (e) {}
            try { sessionStorage.clear(); } catch (e) {}
            try { Object.keys(keep).forEach(function (k) { localStorage.setItem(k, keep[k]); }); } catch (e) {}
            if (window.caches && caches.keys) {
              var keys = await caches.keys();
              await Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }
            if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
              var regs = await navigator.serviceWorker.getRegistrations();
              await Promise.all(regs.map(function (r) { return r.unregister(); }));
            }
          } catch (e) { /* 무시하고 새로고침 */ }
          var hash = window.location.hash;
          var url = new URL(window.location.href);
          url.searchParams.set('_', Date.now());
          window.location.replace(url.pathname + url.search + hash);
        }
      });
    })();
  </script>

  <!-- 모바일: 본문을 터치하면 열려 있던 사이드바를 즉시 접는다 -->
  <script>
    (function () {
      function sidebarOpen() {
        var sb = document.querySelector('.sidebar');
        if (!sb) return false;
        var r = sb.getBoundingClientRect();
        return r.right > 0 && r.left > -20;   // 화면 안에 보이면 열린 상태
      }
      function collapse(e) {
        if (window.innerWidth > 768) return;            // 좁은 화면(모바일)에서만
        var t = e.target;
        if (t.closest('.sidebar') || t.closest('.sidebar-toggle') || t.closest('#draw-toolbar')) return;
        if (sidebarOpen()) document.body.classList.add('close');
      }
      // 터치/클릭 모두에서 즉각 반응
      document.addEventListener('touchstart', collapse, { capture: true, passive: true });
      document.addEventListener('click', collapse, true);
    })();
  </script>
</body>
</html>
