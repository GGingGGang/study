<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="study notes">
  <!-- 문서 자체 캐싱 방지 (브라우저/프록시가 옛 index.html·.md 붙들지 않게) -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>study</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <!-- KaTeX 수식 스타일 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <style>
    /* 캐시 비우기 버튼 (우측 하단 고정) */
    #clear-cache {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 1000;
      padding: 8px 12px;
      font-size: 13px;
      line-height: 1;
      color: #fff;
      background: #42b983;
      border: none;
      border-radius: 20px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .2);
      cursor: pointer;
      opacity: .85;
      transition: opacity .15s ease;
    }
    #clear-cache:hover { opacity: 1; }
    #clear-cache:active { transform: translateY(1px); }
  </style>
</head>
<body>
  <div id="app">로딩 중…</div>
  <button id="clear-cache" title="캐시·스토리지를 비우고 새로고침합니다">🗑 캐시 비우기</button>
  <script>
    window.$docsify = {
      name: 'study',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      // .md 파일을 항상 서버에서 재확인(브라우저 캐시로 옛 내용 표시 방지)
      requestHeaders: {
        'cache-control': 'no-cache'
      },
      search: {
        // 검색 인덱스 localStorage 보관시간을 1시간으로 단축(기본 1일)
        maxAge: 1000 * 60 * 60,
        placeholder: '검색',
        noData: '검색 결과가 없습니다'
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <!-- KaTeX: 인라인 $...$ , 디스플레이 $$...$$ 렌더 (markdown 파싱 전 수식 보호) -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-katex@1.4.4/dist/docsify-katex.js"></script>
  <!-- 캐시·스토리지 정리 버튼 동작 -->
  <script>
    (function () {
      var btn = document.getElementById('clear-cache');
      if (!btn) return;
      btn.addEventListener('click', async function () {
        var prev = btn.textContent;
        btn.textContent = '비우는 중…';
        btn.disabled = true;
        try {
          // 1) localStorage / sessionStorage (Docsify 검색 인덱스 등)
          try { localStorage.clear(); } catch (e) {}
          try { sessionStorage.clear(); } catch (e) {}
          // 2) Cache Storage (PWA/서비스워커 캐시)
          if (window.caches && caches.keys) {
            var keys = await caches.keys();
            await Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }
          // 3) 등록된 서비스워커 해제
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            var regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(function (r) { return r.unregister(); }));
          }
        } catch (e) {
          /* 정리 중 오류는 무시하고 새로고침으로 진행 */
        }
        // 4) 캐시 우회 새로고침 (해시 라우팅은 보존, ?_= 로 강제 재요청)
        var hash = window.location.hash;
        var url = new URL(window.location.href);
        url.searchParams.set('_', Date.now());
        window.location.replace(url.pathname + url.search + hash);
      });
    })();
  </script>
</body>
</html>
